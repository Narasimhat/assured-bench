name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Fails on any high or critical advisory in the shipped dependencies except the ones listed (with reasons) in scripts/check_audit.mjs.
      - run: npm audit --omit=dev --json > audit.json || true
      - run: node scripts/check_audit.mjs audit.json
